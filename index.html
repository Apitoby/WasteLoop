<html lang="en">

catch(e){ document.documentElement.setAttribute('data-theme','light'); }</script>
<meta name="description" content="Snap unwanted items; AI sorts them into reuse, recycle or dispose for your township.">

<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
/* Layout: black brand bar with an orange-led yellow > orange > red stripe; orange is the main colour; left rail on desktop, bottom tabs on phone; one content column */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --surface-2:#EFEDE8; --ink:#121110; --muted:#625D55; --line:#E2DED6;
  --accent:#FF6A13; --accent-ink:#121110; --accent-soft:#FFE8D9; --accent-text:#B03E00;
  --orange:#FF6A13; --yellow:#FFC21A; --red:#D7261E;
  --reuse:#FF6A13; --reuse-ink:#B03E00; --recycle:#F5B400; --recycle-ink:#7E5600; --dispose:#D7261E; --dispose-ink:#B01F18;
  --warn:#C55400; --danger:#C8231B;
  --bar:#121110; --bar-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(18,17,16,.06),0 6px 20px rgba(18,17,16,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C; --surface:#181715; --surface-2:#23211E; --ink:#F6F4EF; --muted:#A8A299; --line:#302D29;
  --accent:#FF7A2E; --accent-ink:#121110; --accent-soft:#3D1D08; --accent-text:#FF9A5C;
  --orange:#FF7A2E; --yellow:#FFC83A; --red:#FF5A4E;
  --reuse:#FF7A2E; --reuse-ink:#FF9A5C; --recycle:#FFC83A; --recycle-ink:#FFD15C; --dispose:#FF5A4E; --dispose-ink:#FF7C72;
  --warn:#FF9A4D; --danger:#FF6A5E;
  --bar:#000000; --bar-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D0C; --surface:#181715; --surface-2:#23211E; --ink:#F6F4EF; --muted:#A8A299; --line:#302D29;
  --accent:#FF7A2E; --accent-ink:#121110; --accent-soft:#3D1D08; --accent-text:#FF9A5C;
  --orange:#FF7A2E; --yellow:#FFC83A; --red:#FF5A4E;
  --reuse:#FF7A2E; --reuse-ink:#FF9A5C; --recycle:#FFC83A; --recycle-ink:#FFD15C; --dispose:#FF5A4E; --dispose-ink:#FF7C72;
  --warn:#FF9A4D; --danger:#FF6A5E;
  --bar:#000000; --bar-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.35rem,2.5vw,1.75rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}
body.out .top,body.out .shell,body.out .tabbar{display:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.top::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--yellow),var(--orange) 28%,var(--orange) 74%,var(--red))}
.top-in{display:flex;align-items:center;gap:10px;padding:9px 16px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.75rem;color:color-mix(in oklab,var(--bar-ink) 60%,transparent);letter-spacing:0}
.spacer{flex:1}
.role-tag{background:var(--yellow);color:#121110;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.top .iconbtn{background:transparent;border-color:color-mix(in oklab,var(--bar-ink) 25%,transparent);color:var(--bar-ink)}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center}
.pts-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:999px;padding:6px 12px;font-size:.84rem;border:0;cursor:pointer;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:50%;border:1.5px solid color-mix(in oklab,var(--bar-ink) 35%,transparent);background:transparent;color:var(--bar-ink);font-weight:800;font-size:.78rem;cursor:pointer;display:grid;place-items:center;flex:none}
.avatar.lg{width:48px;height:48px;background:var(--accent);color:var(--accent-ink);border:0;font-size:1rem;cursor:default}

/* shell */
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding:20px 16px 40px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:3px}
.rail button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:9px 12px;border-radius:11px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.ni{display:grid;place-items:center}
.ni svg{width:20px;height:20px}
.rail button:hover{color:var(--ink)}
.rail button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:110px;padding-top:16px}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;border-radius:10px}
  .tabbar .ni{width:52px;height:30px;border-radius:999px}
  .tabbar .ni svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--ink);font-weight:800}
  .tabbar button[aria-current="page"] .ni{background:var(--accent);color:var(--accent-ink)}
  .brand small{display:none}
}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:.92rem;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.04);border-color:var(--accent)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-outline{background:transparent;border-color:var(--red);color:var(--dispose-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:9px}
.btn.big{padding:13px 18px;font-size:1rem;border-radius:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.linkbtn{border:0;background:none;color:var(--accent-text);font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;color:var(--ink);font-weight:400;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--orange) 22%,transparent)}
textarea{resize:vertical;min-height:70px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.reuse{background:color-mix(in oklab,var(--reuse) 24%,transparent);color:var(--reuse-ink)}
.pill.recycle{background:color-mix(in oklab,var(--recycle) 18%,transparent);color:var(--recycle-ink)}
.pill.dispose{background:color-mix(in oklab,var(--dispose) 16%,transparent);color:var(--dispose-ink)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:color-mix(in oklab,var(--red) 14%,transparent);color:var(--dispose-ink)}
.pill.accent{background:var(--accent-soft);color:var(--accent-text)}
.sample-tag{font-size:.7rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{max-width:62ch}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.err{color:var(--danger);font-weight:600;font-size:.9rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* sign-in */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.gate-hero{background:var(--bar);color:var(--bar-ink);padding:36px 16px 76px;position:relative}
.gate-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--yellow),var(--orange) 28%,var(--orange) 74%,var(--red))}
.gate-hero .in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gate-hero .brand{font-size:1.4rem}
.gate-hero .brand-mark{width:40px;height:40px}
.gate-hero h1{font-size:clamp(1.6rem,6vw,2.1rem);color:var(--bar-ink)}
.gate-hero h1 em{font-style:normal;color:var(--accent)}
.gate-hero p{color:color-mix(in oklab,var(--bar-ink) 72%,transparent);max-width:38ch}
.gate-card{width:calc(100% - 32px);max-width:440px;margin:-48px auto 32px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:var(--shadow);position:relative;z-index:1;gap:12px}
.demo{background:var(--surface-2);border-radius:10px;padding:9px 11px;color:var(--muted)}
.demo b{color:var(--ink)}
.gate-switch{display:flex;justify-content:center;padding-top:4px;border-top:1px solid var(--line)}

/* home */
.hello{display:flex;flex-direction:column;gap:3px}
.install{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.install svg{width:20px;height:20px;flex:none;color:var(--accent-text)}
.listgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:700px){.listgrid{grid-template-columns:minmax(0,1fr)}}
.picker{position:relative;aspect-ratio:4/3;border-radius:16px;border:2px dashed color-mix(in oklab,var(--orange) 55%,var(--line));background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;cursor:pointer;overflow:hidden;max-width:100%}
.picker.over{border-color:var(--orange);background:var(--accent-soft)}
.picker input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.picker .cam{width:60px;height:60px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.picker .cam svg{width:28px;height:28px}
.picker img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface-2)}
.picker .change{position:absolute;left:10px;bottom:10px;z-index:1;background:rgba(10,9,8,.65);color:#fff;font-size:.8rem;font-weight:700;padding:5px 10px;border-radius:999px;pointer-events:none}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;counter-reset:st}
.howto div{display:flex;gap:8px;align-items:flex-start;font-size:.82rem;color:var(--muted);min-width:0}
.howto b{display:block;color:var(--ink);font-size:.88rem}
.howto div::before{counter-increment:st;content:counter(st);flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;font-size:.75rem;display:grid;place-items:center}
@media (max-width:520px){.howto{grid-template-columns:minmax(0,1fr)}}
.cta{display:flex;align-items:center;gap:14px;padding:14px;background:var(--bar);color:var(--bar-ink);border:0;border-radius:var(--r);cursor:pointer;text-align:left;width:100%;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--yellow),var(--orange) 40%,var(--red))}
.cta .cam{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.cta .cam svg{width:22px;height:22px}
.cta span.t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cta small{color:color-mix(in oklab,var(--bar-ink) 70%,transparent);font-size:.82rem}
.cta .go{font-weight:800;color:var(--accent)}
.snapcard{display:flex;flex-direction:column;gap:12px;padding:14px}
.snap-row{display:flex;gap:12px;align-items:center}
.snap-row > div{min-width:0}
.snap-btn{position:relative;flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;overflow:hidden}
.snap-btn svg{width:26px;height:26px}
.snap-btn img{width:100%;height:100%;object-fit:cover;display:block}
.snap-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.snap-btn.over{outline:3px solid var(--orange);outline-offset:2px}
.snap-form{display:flex;gap:8px}
.snap-form input{flex:1;min-width:0}
.snap-form .btn{flex:none}
.legend3{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-weight:600}
.legend3 .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d.reuse{background:var(--reuse)} .d.recycle{background:var(--recycle)} .d.dispose{background:var(--dispose)}
.rowlist{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.irow:last-child{border-bottom:0}
.irow .th{width:48px;height:48px;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center}
.irow .th img{width:100%;height:100%;object-fit:cover}
.irow .th .glyph{width:26px;height:26px}
.irow .tx{display:flex;flex-direction:column;min-width:0}
.irow .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini b{font-family:var(--f-display);font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}

/* snap flow */
.analyzing{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:start}
.photo{width:100%;max-width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--surface-2);display:block}
.scanwrap{position:relative;overflow:hidden;border-radius:12px}
.scanwrap::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 16px 4px var(--orange);top:0;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
@media (prefers-reduced-motion:reduce){.scanwrap::after{animation:none;top:50%}}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog-top b{font-size:.95rem}
.prog-top .mono{font-weight:700;color:var(--accent-text)}
.prog-bar{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange) 55%,var(--red));border-radius:5px;transition:width .25s linear}
.steps{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:8px}
.steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;box-sizing:border-box}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{border-color:var(--orange);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done::before{content:"\2713";background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:900;line-height:10px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.now::before{animation:none}.prog-bar i{transition:none}}
.verdict{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:18px}
@media (max-width:620px){.verdict{grid-template-columns:minmax(0,1fr)}.verdict .photo{max-width:160px}}
.stamp{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding:3px 12px 3px 5px;border-radius:11px;border:2.5px solid currentColor;transform:rotate(-1.5deg)}
.stamp .ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:currentColor}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.t td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.t th.n{text-align:right}
.tablewrap{overflow-x:auto}
.ledger{display:flex;flex-direction:column}
.ledger div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}

.plus{color:var(--accent-text);font-family:var(--f-mono);font-weight:700}

.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.rule.reuse .p{color:var(--reuse-ink)} .rule.recycle .p{color:var(--recycle-ink)} .rule.receive .p{color:var(--accent-text)}
.show{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}

.ba svg{position:absolute;inset:14px 14px 26px;width:calc(100% - 28px);height:calc(100% - 40px)}
.proj .body{padding:14px;display:flex;flex-direction:column;gap:6px}
.ba div > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .tag{position:relative;z-index:1;background:rgba(10,9,8,.6);color:#fff;padding:2px 7px;border-radius:5px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{position:relative}
input[type=file]{font-size:.85rem;color:var(--muted)}
.mthumb{width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;flex:none}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .glyph{width:24px;height:24px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pp .slot{aspect-ratio:4/3;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;position:relative}
.pp .slot img{width:100%;height:100%;object-fit:cover;display:block}
.kpi.money{background:var(--accent-soft);border-color:color-mix(in oklab,var(--orange) 45%,var(--line))}
.kpi .sub{font-size:.76rem;color:var(--muted);line-height:1.35}
.moneysplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:center}
@media (max-width:700px){.moneysplit{grid-template-columns:minmax(0,1fr)}}
.bigrm{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.02em;color:var(--accent-text);font-variant-numeric:tabular-nums;line-height:1.05}
.bigrm small{font-size:.5em;margin-right:4px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,9,8,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim.bottom{align-items:flex-end;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:821px){.scrim.bottom{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;max-width:440px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.confirm{gap:12px}
.confirm .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.proto{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.qr{align-self:center;padding:12px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.code{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;letter-spacing:.2em;text-align:center}
.cam{width:100%;max-width:280px;aspect-ratio:1;object-fit:cover;border-radius:16px;align-self:center;background:#0b0a09}
.notif{display:flex;flex-direction:column;gap:2px;padding:11px 8px;margin:0 -8px;border:0;border-bottom:1px solid var(--line);font-size:.9rem;background:none;text-align:left;width:calc(100% + 16px);cursor:pointer;color:var(--ink);border-radius:8px}
.notif:hover{background:var(--surface-2)}
.notif .go{color:var(--accent-text);font-weight:700}
.notif.unread b::before{content:"";display:inline-block;width:7px;height:7px;background:var(--orange);border-radius:50%;margin-right:7px;vertical-align:2px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:.92rem}

.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:color-mix(in oklab,var(--orange) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--orange) 40%,var(--line));font-size:.88rem}
.banner svg{width:19px;height:19px;flex:none;color:var(--orange);margin-top:1px}

/* launch screen: plays once each time the app is opened; tap to skip */
#splash{position:fixed;inset:0;z-index:200;background:#121110;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:sp-out .45s ease 2.35s forwards}
#splash.done{animation:sp-out .3s ease forwards}
@keyframes sp-out{to{opacity:0;visibility:hidden}}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;text-align:center}
.sp-mark{width:120px;height:120px;overflow:visible}
.sp-arc,.sp-head{fill:none;stroke:#FF6A13;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.sp-arc{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:sp-draw .6s cubic-bezier(.6,0,.2,1) .15s forwards}
.sp-arc.b{animation-delay:.32s}
.sp-head{opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-pop .28s ease .72s forwards}
.sp-head.b{animation-delay:.82s}
.sp-rot{transform-box:view-box;transform-origin:24px 24px;animation:sp-spin .95s cubic-bezier(.65,0,.35,1) 1s}
.sp-dot{fill:#FFC21A;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sp-dot .45s cubic-bezier(.3,1.7,.5,1) .55s forwards}
.sp-word{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,9vw,3rem);letter-spacing:-.03em;line-height:1;opacity:0;transform:translateY(12px);animation:sp-up .5s ease 1.05s forwards}
.sp-word .o{color:#FF6A13}
.sp-tag{color:rgba(255,255,255,.72);font-size:.98rem;opacity:0;transform:translateY(8px);animation:sp-up .5s ease 1.4s forwards}
.sp-bar{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:5px;background:rgba(255,255,255,.08)}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC21A,#FF6A13 45%,#D7261E);animation:sp-fill 2.1s cubic-bezier(.4,0,.2,1) .2s forwards}
.sp-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);opacity:0;animation:sp-up .4s ease .9s forwards}
@keyframes sp-draw{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes sp-pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes sp-spin{to{transform:rotate(360deg)}}
@keyframes sp-dot{to{transform:scale(1)}}
@keyframes sp-up{to{opacity:1;transform:none}}
@keyframes sp-fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
  .sp-bar i{width:100%}
  #splash{animation:sp-out .3s ease 1s forwards}
}
</style>

<script>
(function(){
  var sp = document.getElementById('splash'); if(!sp) return;
  try{ if(sessionStorage.getItem('wl-splash')){ sp.remove(); return; } sessionStorage.setItem('wl-splash','1'); }catch(e){}
  function bye(){ if(!sp.isConnected) return; sp.classList.add('done'); setTimeout(function(){ sp.remove(); }, 320); }

  setTimeout(function(){ if(sp.isConnected) sp.remove(); }, 2900);
})();

async function fileToDataUrl(file, max=640, q=0.78){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

    const ws = w.text.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>3);
    const hit = ws.some(x=>words.includes(x)) || (ws.length===0 && w.category===l.category);
    if(hit) notify(w.userId,`Wishlist match: “${l.title}” was just posted in ${l.zone}. It matches your request for “${w.text}”.`);
  });
}
function liveStats(){
  // events from this prototype (current period)
  const ev = [];
  S.listings.forEach(l=>{
    if(l.status==='reused') ev.push({zone:l.zone,at:l.doneAt,reuseKg:l.weightKg,recycleKg:0,items:1,valueRm:l.valueRm,co2:co2For(l.category,'reuse',l.weightKg),cat:l.category});
    if(l.status==='recycled') ev.push({zone:l.zone,at:l.doneAt,reuseKg:0,recycleKg:l.weightKg,items:0,valueRm:0,co2:co2For(l.category,'recycle',l.weightKg),cat:l.category});
  });
  S.weighins.forEach(w=>ev.push({zone:w.zone,at:w.at,reuseKg:0,recycleKg:w.kg,items:0,valueRm:0,co2:Math.round(w.kg*0.9*10)/10,cat:w.material}));
  return ev;
}
function esg(){
  const ev = liveStats(), mNow = monthKey(now());
  const months = []; for(let m=5;m>=0;m--) months.push(mNow-m);
  const byMonth = months.map(mk=>{
    const h = S.history.filter(x=>x.month===mk), e = ev.filter(x=>monthKey(x.at)===mk);
    const sum = k => h.reduce((a,b)=>a+b[k],0)+e.reduce((a,b)=>a+b[k],0);
    return {mk,reuseKg:sum('reuseKg'),recycleKg:sum('recycleKg'),items:sum('items'),valueRm:sum('valueRm'),co2:sum('co2')};
  });
  const all = [...S.history,...ev];
  const tot = k => all.reduce((a,b)=>a+(b[k]||0),0);
  const byZone = ZONES.map(z=>{ const a=all.filter(x=>x.zone===z); return {zone:z,reuseKg:a.reduce((s,x)=>s+x.reuseKg,0),recycleKg:a.reduce((s,x)=>s+x.recycleKg,0)}; });
  return {byMonth,byZone,ev,total:{kg:tot('reuseKg')+tot('recycleKg'),items:tot('items'),valueRm:tot('valueRm'),co2:tot('co2'),reuseKg:tot('reuseKg'),recycleKg:tot('recycleKg')}};
}

const CATS = Object.keys(CAT);
function aiPrompt(desc){
  return `You are the sorting assistant inside WasteLoop, a reuse-and-recycle app for residents of a Sime Darby Property township (Elmina, Selangor, Malaysia). A resident ${desc?`described an item they no longer want: "${desc.slice(0,600)}"`:'attached a photo of an item they no longer want'}${desc&&U.snap.blob?' and also attached a photo of it':''}. Decide its best route following the 3R hierarchy: Reuse first, Recycle second, Dispose only as a last resort.

- "reuse": usable as-is or after a simple clean or fix; a neighbour would plausibly want it for free or as a swap.
- "recycle": broken, worn out or unlikely to be wanted, but its materials fit Malaysian recycling streams (paper, plastics, metal, glass, e-waste, textiles, bulky wood/furniture).
- "dispose": contaminated, hazardous or not recyclable. For hazardous items (batteries, paint, fluorescent tubes, chemicals, gas canisters) explain safe disposal in handling_tip.

Reply with only one JSON object, no other text:
{"is_item": true, "item": "short name, max 6 words", "category": one of ${JSON.stringify(CATS)}, "description": "1-2 sentence listing description written for neighbours, mention visible condition", "condition": "good"|"fair"|"worn"|"broken", "route": "reuse"|"recycle"|"dispose", "confidence": number 0-1, "reason": "1-2 plain sentences on why this route", "material": "main material", "est_weight_kg": number, "est_value_rm": second-hand value in Malaysian ringgit (0 if not reusable), "handling_tip": "one practical tip: cleaning before handover, which recycling stream, or safe disposal"}
If the ${desc?'description':'photo'} does not show a household item someone could give away or discard, set "is_item": false and fill other fields with your best guess.`;
}
async function toBlobs(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const mk = (max,q)=>{ const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c; };
    const blob = mk(1024).toDataURL('image/jpeg',0.82).split(',')[1]; // base64 sent to the AI server
    const thumb = mk(420).toDataURL('image/jpeg',0.72);
    return {blob,thumb};
  } finally { URL.revokeObjectURL(url); }
}
async function analyze(){
  const sn = U.snap;
  if(!U.sample) await checkAI();
  if(!U.sample){ sn.stage='error'; sn.err='The AI server is not connected yet (see the README to add your API key). You can choose a route yourself for now.'; render(); return; }
  sn.stage='analyzing'; sn.err=''; sn.chat=[]; S.view='market'; S.marketTab='list'; startProgress(); render();
  U.ctl = new AbortController();
  try{
    const opts = {signal:U.ctl.signal};
    if(sn.blob) opts.imageData=sn.blob;
    const j = await U.sample.json(aiPrompt(sn.desc.trim()), opts);
    if(!j || typeof j!=='object') throw {code:'invalid_json'};
    const route = ['reuse','recycle','dispose'].includes(j.route)? j.route : 'recycle';
    sn.result = {
      isItem: j.is_item!==false, item:String(j.item||'Unnamed item').slice(0,60),
      category: CATS.includes(j.category)? j.category:'other', description:String(j.description||''),
      condition:String(j.condition||'fair'), route, confidence:Math.max(0,Math.min(1,Number(j.confidence)||0.6)),
      reason:String(j.reason||''), material:String(j.material||'—'),
      weightKg:Math.max(0.1,Number(j.est_weight_kg)||1), valueRm:Math.max(0,Math.round(Number(j.est_value_rm)||0)),
      tip:String(j.handling_tip||''),
    };
    sn.route = route; sn.title = sn.result.item; sn.descEdit = sn.result.description;
    await finishProgress();
    if(sn.stage!=='analyzing') return;   // stopped while finishing
    sn.stage='result';
  }catch(e){
    stopProgress();
    if(e?.code==='cancelled'||e?.name==='AbortError'){ sn.stage='idle'; }
    else if(e instanceof TypeError){ sn.stage='error'; sn.err='No internet connection. AI sorting needs to be online; your listings and points still work offline.'; }
    else { sn.stage='error'; sn.err = errCopy(e?.code) + (e?.message && !['not_granted','rate_limited'].includes(e?.code) ? ` (Details: ${String(e.message).slice(0,200)})` : ''); }
  }
  render();
}

function progSteps(){
  return [
    [0,  U.snap.blob ? 'Uploading photo' : 'Reading your description'],
    [15, 'Identifying the item'],

function progressHtml(){
  const pct = U.prog?.pct || 0, steps = progSteps();
  const cur = steps.filter(([at])=>pct>=at).pop();
  return `<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" id="pg">
    <div class="prog-top"><b id="pgStep">${esc(cur[1])}${pct<100?'…':''}</b><span class="mono" id="pgPct">${Math.round(pct)}%</span></div>
    <div class="prog-bar"><i id="pgBar" style="width:${pct}%"></i></div>
    <ol class="steps" id="pgSteps">${steps.slice(0,-1).map(([at,label],i)=>{
      const next = steps[i+1][0], st = pct>=next ? 'done' : pct>=at ? 'now' : '';
      return `<li class="${st}">${esc(label)}</li>`; }).join('')}</ol>
  </div>`;
}
function paintProgress(){
  const el = document.getElementById('pg'); if(!el) return;

    U.prog.pct = Math.min(92, 92*(1-Math.exp(-t/8)));   // ~45% at 5s, ~70% at 10s, ~90% at 30s

}

function itemCard(l){
  const owner = user(l.ownerId), mine = l.ownerId==='me', t = now();

  const clock = l.status==='open' ? `<span class="clock ${dleft<=WARN_DAYS?'low':''}">${dleft>=1?Math.floor(dleft)+'d '+Math.floor((dleft%1)*24)+'h':Math.max(0,Math.floor(left/36e5))+'h'} left</span>` : '';
  let act = '';
  if(l.status==='open') act = mine ? `<button class="btn sm" data-act="sim-claim" data-v="${l.id}" title="Prototype: pretend a neighbour claims it">Simulate a claim</button>` : `<button class="btn sm primary" data-act="claim" data-v="${l.id}">${l.mode==='swap'?'Offer swap':"I'll take it"}</button>`;
  else if(l.status==='reserved') act = mine ? `<button class="btn sm primary" data-act="show-qr" data-v="${l.id}">${I.qr} Show QR</button>` : (l.claimerId==='me'?`<button class="btn sm primary" data-act="scan" data-v="${l.id}">${I.qr} Scan at pickup</button>`:`<span class="pill neutral">Reserved</span>`);
  const status = {open:'',reserved:'<span class="pill warn">Reserved</span>',reused:'<span class="pill reuse">Reused</span>',routed:'<span class="pill recycle">To recycling</span>',scheduled:'<span class="pill recycle">Pickup scheduled</span>',recycled:'<span class="pill recycle">Recycled</span>',disposed:'<span class="pill dispose">Disposed</span>',removed:'<span class="pill neutral">Removed</span>'}[l.status]||'';
  return `<article class="item">
    <div class="thumb zoomable" data-act="zoom" data-cap="${esc(l.title)}">${itemThumb(l, l.title)}<span class="zoom-hint" hidden>${ZOOM_ICON}</span>
      <div class="badges"><span class="pill ${l.mode==='swap'?'accent':'reuse'}">${l.mode==='swap'?'Swap':'Free'}</span>${status}</div></div>
    <div class="body"><h3>${esc(l.title)}</h3>

function shapeSvg(s){
  const st='style="fill:none;stroke:currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
  if(s==='gazebo') return `<svg viewBox="0 0 100 60" ${st}><path d="M10 26L50 6l40 20M18 26v30M82 26v30M50 6v4M14 26h72M30 56V36h40v20M6 56h88"/></svg>`;
  if(s==='bench') return `<svg viewBox="0 0 100 60" ${st}><path d="M10 34h80M14 34v20M86 34v20M10 26h80v8H10zM30 34v20M70 34v20M4 56h92"/></svg>`;
  if(s==='planter') return `<svg viewBox="0 0 100 60" ${st}><path d="M12 34h76l-6 22H18zM30 34c0-12 6-20 6-26M36 20c6-2 10 0 12 6M50 34c0-10 4-16 10-22M60 20c6 0 8 4 8 8M70 34c-2-8 2-12 6-14"/></svg>`;
  return `<svg viewBox="0 0 100 60" ${st}><path d="M20 20h60v36H20zM20 20l30-14 30 14"/></svg>`;
}
function projImg(p, side, fallback=''){
  if(p[side]) return `<img src="${p[side]}" alt="">`;
  return SHOW_IMG[p.id] ? slotImg(SHOW_IMG[p.id]+'-'+side, '', fallback) : fallback;
}

/* ---------- admin: ESG ---------- */
function vESG(){
  const e = esg(), bm = e.byMonth, cur = bm[5], prev = bm[4];
  const pp = bm[3];  // compare the last two full months, since this month has only just started
  const d = (a,b)=>{ if(!b) return ''; const p=(a-b)/b*100; return `<span class="delta ${p<0?'neg':''}">${p>=0?'▲':'▼'} ${fmt(Math.abs(p),0)}% in ${MON[prev.mk%12]}</span>`; };
  // chart
  const W=640,H=260,pl=48,pr=12,pt=14,pb=30, cw=(W-pl-pr)/bm.length;
  const max = Math.max(...bm.map(m=>m.reuseKg+m.recycleKg)); const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const y = v => pt + (H-pt-pb)*(1-v/top);
  let grid=''; for(let v=0; v<=top; v+=step) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" style="fill:var(--muted);font:11px var(--f-mono)">${fmt(v)}</text>`;
  const bars = bm.map((m,i)=>{ const x=pl+i*cw+cw*0.22, bw=cw*0.56; const isCur=i===5;
    return `<rect x="${x}" y="${y(m.reuseKg)}" width="${bw}" height="${y(0)-y(m.reuseKg)}" rx="3" style="fill:var(--reuse);opacity:${isCur?1:.85}"/>
      <rect x="${x}" y="${y(m.reuseKg+m.recycleKg)}" width="${bw}" height="${y(m.reuseKg)-y(m.reuseKg+m.recycleKg)}" rx="3" style="fill:var(--recycle);opacity:${isCur?1:.85}"/>
      <text x="${x+bw/2}" y="${y(m.reuseKg+m.recycleKg)-6}" text-anchor="middle" style="fill:var(--ink);font:600 11px var(--f-mono)">${fmt(m.reuseKg+m.recycleKg)}</text>
      <text x="${x+bw/2}" y="${H-10}" text-anchor="middle" style="fill:${isCur?'var(--ink)':'var(--muted)'};font:${isCur?700:500} 11.5px var(--f-body)">${MON[m.mk%12]}${isCur?' (MTD)':''}</text>`; }).join('');
  // category split from live + approximations of history (history has no category) -> use live listings incl. open/routed
  const catTot = {}; S.listings.filter(l=>l.status!=='removed').forEach(l=>{ catTot[l.category]=(catTot[l.category]||0)+l.weightKg; });

function vHeat(){

function sheet(html, cls=''){ document.getElementById('overlay').innerHTML = `<div class="scrim ${cls}" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; afterRender(); }
function openZoom(el){
  const im = el.tagName==='IMG' ? el : el.querySelector('img:not([hidden])');

}
function closeSheet(){ stopScanner(); document.getElementById('overlay').innerHTML=''; }
function toast(t){ const h=document.getElementById('toastHost'); h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>h.innerHTML='',2800); }
function showNotifs(){

  list.forEach(n=>n.read=true); save(); render();

function showScan(id){

  sheet(`<div class="sheet-head"><div><span class="eyebrow">Pickup</span><h2>Scan ${esc(user(l.ownerId).name)}'s QR</h2></div><button class="iconbtn" data-act="close" aria-label="Close">${I.x}</button></div>
    <video class="cam" id="cam" playsinline muted></video>
    <p class="small muted" id="camMsg">Starting camera… Point it at the QR on the owner's phone.</p>
    <p class="small muted">No camera? Type the 6-character code under their QR. Demo code: <b class="mono">${l.code}</b></p>
    <form class="row" data-form="code" data-v="${l.id}" style="flex-wrap:nowrap"><input type="text" id="codeIn" maxlength="6" placeholder="Code" style="text-transform:uppercase;font-family:var(--f-mono);letter-spacing:.15em"><button class="btn primary">Confirm</button></form>`);
  startScanner(l);
}
let camStream=null, camRaf=0;
function stopScanner(){ cancelAnimationFrame(camRaf); camStream?.getTracks().forEach(t=>t.stop()); camStream=null; }
async function startScanner(l){
  const vid=document.getElementById('cam'), msg=document.getElementById('camMsg');
  if(!navigator.mediaDevices?.getUserMedia || !window.jsQR){ vid.hidden=true; msg.textContent='Camera scanning is not available here. Use the code instead.'; return; }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    if(!document.getElementById('cam')){ stopScanner(); return; }
    vid.srcObject=camStream; await vid.play(); msg.textContent='Point the camera at the QR code.';
    const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!document.getElementById('cam')){ stopScanner(); return; }
      if(vid.readyState>=2){ c.width=vid.videoWidth; c.height=vid.videoHeight; ctx.drawImage(vid,0,0);
        const res = jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
        if(res?.data){ const p=res.data.split(':');
          if(p[0]==='wasteloop' && p[2]===l.id && p[3]===l.code){ stopScanner(); confirmPickup(l); save(); closeSheet(); render(); toast(`Pickup confirmed. +${PTS.receive} points, and ${user(l.ownerId).name} got +${PTS.reuse}`); return; }
          msg.textContent='That QR is for a different item.'; }
      }
      camRaf=requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ vid.hidden=true; msg.textContent='Camera permission was not given. Use the code instead.'; }
}
function confirmPickup(l){
  l.status='reused'; l.doneAt=now();
  award(l.ownerId,PTS.reuse,`Reuse handover: ${l.title}`);
  award(l.claimerId,PTS.receive,`Received: ${l.title}`);
  const co2 = co2For(l.category,'reuse',l.weightKg);
  if(l.ownerId==='me'||l.claimerId==='me'){ S.mine.kg+=l.weightKg; S.mine.co2+=co2; if(l.ownerId==='me') S.mine.items++; }
  if(l.claimerId==='me') S.mine.savedRm += l.valueRm||0;   // you took it instead of buying new
  if(l.ownerId==='me') S.mine.gaveRm += l.valueRm||0;      // your neighbour didn't have to buy it
  if(l.ownerId==='me') notify('me',`${user(l.claimerId).name} scanned your QR. +${PTS.reuse} points for “${l.title}”.`);
  else notify(l.ownerId,`You scanned the handover for “${l.title}”.`);
}

/* ---------- events ---------- */
// Ignore taps that land within a moment of scrolling (a swipe on the phone shouldn't press buttons).
let lastScroll = 0;
// Only finger swipes count, not scrolls the app makes itself (like jumping to the top on a new tab).
addEventListener('touchmove', ()=>{ lastScroll = Date.now(); }, {passive:true});
document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if(a==='close-bg'){ if(ev.target===t){ pendingConfirm=null; closeSheet(); } return; }
  if(Date.now()-lastScroll < 250 && a!=='close'){ ev.preventDefault(); return; }
  doAct(a, v, t);
});
function doAct(a, v, t){
  const L = id => S.listings.find(x=>x.id===id);
  switch(a){
    case 'go': if(isAdmin()){ if(ADM_NAV.some(n=>n[0]===v)) S.adminView=v; } else if(RES_NAV.some(n=>n[0]===v)) S.view=v;
      save(); render(); window.scrollTo(0,0); break;
    case 'notifs': showNotifs(); break;
    case 'account': showAccount(); break;
    case 'close': pendingConfirm=null; closeSheet(); break;
    case 'confirm-yes': { const fn=pendingConfirm; pendingConfirm=null; closeSheet(); if(fn) fn(); break; }
    case 'gate-mode': U.gate={mode:v,err:'',busy:false,id:''}; render(); break;
    case 'logout': confirmSheet({title:'Sign out of WasteLoop?', body:'Your listings and points stay on this phone.', ok:'Sign out', tone:'danger'}, ()=>{
        setSession(null); resetSnap(); U.gate={mode:'resident',err:'',busy:false,id:''}; render(); window.scrollTo(0,0); }); break;
    case 'skip': closeSheet(); S.dayOffset++; processClock(); save(); render(); toast(`Clock moved to day +${S.dayOffset}`); break;
    case 'reset': confirmSheet({title:'Reset all demo data?', body:'Listings, points, notifications and weigh-ins on this phone go back to the sample data. You stay signed in.', ok:'Reset', tone:'danger'}, ()=>{
        try{localStorage.removeItem(KEY)}catch(e){} S=seed(); applySession(); resetSnap(); processClock(); save(); render(); toast('Demo data reset'); }); break;
    case 'dismiss-install': try{ localStorage.setItem('wl-install-dismissed','1'); }catch(e){} render(); break;
    case 'cancel-ai': U.ctl?.abort(); break;
    case 'manual': { const sn=U.snap; sn.result={isItem:true,item:(sn.desc||'My item').slice(0,40),category:'other',description:sn.desc,condition:'fair',route:'reuse',confidence:0,reason:'Route chosen by you (AI unavailable).',material:'—',weightKg:3,valueRm:0,tip:''}; sn.route='reuse'; sn.title=sn.result.item; sn.descEdit=sn.desc; sn.stage='result'; render(); break; }
    case 'new-snap': resetSnap(); render(); window.scrollTo(0,0); break;
    case 'go-list': S.view='market'; S.marketTab='list'; save(); render(); window.scrollTo(0,0); break;
    case 'zoom': openZoom(t); break;
    case 'notif-go': notifGo(v); break;
    case 'theme': setTheme(v); showAccount(); break;
    case 'route': U.snap.route=v; keepEdits(); render(); break;
    case 'mode': keepEdits(); U.snap.mode=v; render(); break;
    case 'ask': askWhy(v); break;
    case 'post': keepEdits(); confirmSheet({title:`Post “${(U.snap.title||U.snap.result.item).slice(0,60)}”?`, body:`Neighbours can claim it for ${LIST_DAYS} days. If no one does, it goes to SDP recycling.`, ok:'Post listing'}, postListing); break;
    case 'to-recycle': confirmSheet({title:'Send to SDP recycling?', body:`It joins the collection queue for ${user('me').zone}. You get ${PTS.recycle} points when SDP collects it.`, ok:'Add to queue'}, sendRecycle); break;
    case 'done-dispose': resetSnap(); render(); toast('Thanks for disposing safely'); break;
    case 'mtab': S.marketTab=v; save(); render(); break;
    case 'cat': S.cat=v; render(); break;
    case 'claim': { const l=L(v); if(!l||l.status!=='open') break;
      confirmSheet({title:`${l.mode==='swap'?'Offer a swap for':'Claim'} “${l.title}”?`, body:`It will be reserved for you. Collect it from ${user(l.ownerId).name} in ${l.zone} and scan their QR at pickup.`, ok:l.mode==='swap'?'Offer swap':'Reserve it'}, ()=>{
        if(l.status!=='open') return; l.status='reserved'; l.claimerId='me';
        notify(l.ownerId,`A neighbour claimed “${l.title}”.`); save(); render(); toast(`Reserved. Scan ${user(l.ownerId).name}'s QR at pickup.`); }); break; }
    case 'scan': showScan(v); break;
    case 'show-qr': showQR(v); break;
    case 'sim-claim': { const l=L(v); if(!l) break;
      confirmSheet({title:'Simulate a neighbour claim?', body:'Prototype tool: a sample neighbour reserves your item so you can demo the QR handover.', ok:'Simulate'}, ()=>{
        const nb=S.users.filter(u=>u.id!=='me')[Math.floor(Math.random()*5)];
        l.status='reserved'; l.claimerId=nb.id; notify('me',`${nb.name} from ${nb.zone} claimed your “${l.title}”. Show your QR at pickup.`); save(); render(); showQR(l.id); }); break; }
    case 'sim-scan': { const l=L(v); if(!l) break; confirmPickup(l); save(); closeSheet(); render(); toast(`Handover confirmed. +${PTS.reuse} points`); break; }
    case 'show-photos': showPhotos(v); break;
    case 'clear-show-photos': { const p=S.showcase.find(x=>x.id===v); if(!p) break;
      confirmSheet({title:`Remove photos from “${p.title}”?`, body:'Only photos added on this phone are removed. Files in the images folder stay.', ok:'Remove', tone:'danger'}, ()=>{ delete p.before; delete p.after; save(); render(); toast('Photos removed'); }); break; }
    case 'unwish': S.wishlist=S.wishlist.filter(w=>w.id!==v); save(); render(); break;
    case 'redeem': { const r=S.rewards.find(x=>x.id===v); if(!r||S.points.me<r.cost) break;
      confirmSheet({title:`Redeem ${r.name}?`, body:`${fmt(r.cost)} points will be used. You'll have ${fmt(S.points.me-r.cost)} left.`, ok:'Redeem'}, ()=>{
        if(S.points.me<r.cost) return; award('me',-r.cost,`Redeemed: ${r.name}`);
        S.redemptions.unshift({name:r.name,partner:r.partner,code:'EL-'+code6(),at:now()}); save(); render(); toast(`Redeemed ${r.name}`); }); break; }
    case 'collected': { const l=L(v); if(!l) break;
      confirmSheet({title:`Mark “${l.title}” as collected?`, body:`${user(l.ownerId).name} gets ${PTS.recycle} points and ${fmt(l.weightKg,1)} kg goes into the ESG record.`, ok:'Mark collected'}, ()=>{
        if(l.status!=='scheduled') return; l.status='recycled'; l.doneAt=now(); award(l.ownerId,PTS.recycle,`Recycled: ${l.title}`);
        if(l.ownerId==='me'){ S.mine.kg+=l.weightKg; S.mine.co2+=co2For(l.category,'recycle',l.weightKg); }
        notify(l.ownerId,`SDP collected “${l.title}” for recycling. +${PTS.recycle} points.`); save(); render(); toast('Logged as collected'); }); break; }
    case 'remove': { const l=L(v); if(!l) break;
      confirmSheet({title:`Remove “${l.title}”?`, body:'It disappears from the marketplace and the owner is told it is under review.', ok:'Remove listing', tone:'danger'}, ()=>{
        if(l.status!=='open') return; l.status='removed'; notify(l.ownerId,`SDP removed your listing “${l.title}” for review.`); save(); render(); toast('Listing removed'); }); break; }
  }
}
document.addEventListener('change', async ev=>{
  const pf = ev.target.dataset?.photoFor, sp = ev.target.dataset?.showPhoto;
  if(pf || sp){ const f = ev.target.files?.[0]; if(!f) return;
    try{
      const url = await fileToDataUrl(f, sp?800:560);
      if(pf){ const l=S.listings.find(x=>x.id===pf); if(l){ l.photo=url; save(); render(); toast('Photo added'); } }
      else { const [id,side]=sp.split(':'); const p=S.showcase.find(x=>x.id===id); if(p){ p[side]=url; save(); render(); showPhotos(id); toast('Photo added'); } }
    }catch(e){ toast('That file could not be opened as an image'); }
    return;
  }
  if(ev.target.id==='photo'){ const f=ev.target.files?.[0]; if(!f) return;
    try{ const {blob,thumb}=await toBlobs(f); U.snap.blob=blob; U.snap.photo=thumb; U.snap.desc=document.getElementById('desc')?.value||U.snap.desc; if(U.snap.stage==='error') U.snap.stage='idle'; render(); }
    catch(e){ toast('That file could not be opened as an image'); }
  }
});
document.addEventListener('input', ev=>{
  if(ev.target.id==='desc'){ U.snap.desc=ev.target.value; const b=document.getElementById('goBtn'); if(b) b.disabled=!(U.snap.photo||U.snap.desc.trim()); }
});
document.addEventListener('drop', ev=>{ const dz=ev.target.closest?.('#drop'); if(!dz) return; ev.preventDefault();
  const f=ev.dataTransfer?.files?.[0]; if(f){ const inp=document.getElementById('photo'); const dt=new DataTransfer(); dt.items.add(f); inp.files=dt.files; inp.dispatchEvent(new Event('change',{bubbles:true})); } });
document.addEventListener('submit', ev=>{
  const f = ev.target.closest('[data-form]'); if(!f) return; ev.preventDefault();
  const k = f.dataset.form, val = id => (document.getElementById(id)?.value||'').trim();
  if(k==='login'){ doLogin(); return; }
  if(k==='snap'){ U.snap.desc = document.getElementById('desc')?.value||''; if(U.snap.photo||U.snap.desc.trim()) analyze(); return; }
  if(k==='ask'){ const i=document.getElementById('chatq'); const q=i.value; i.value=''; askWhy(q); }
  if(k==='wish'){ const txt=val('wishText'); if(!txt) return; S.wishlist.unshift({id:uid('w'),userId:'me',text:txt.slice(0,80),category:'other',at:now()});
    const hit = S.listings.find(l=>l.status==='open'&&l.ownerId!=='me'&&txt.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>3).some(w=>(l.title+' '+l.description).toLowerCase().includes(w)));
    if(hit) notify('me',`Good news: “${hit.title}” in ${hit.zone} already matches your wishlist.`);
    save(); render(); toast(hit?'Added. There is already a match, check notifications':'Added to your wishlist'); }
  if(k==='weigh'){ const kgv=Number(val('wk')), zone=val('wz'), mat=val('wm'); if(!(kgv>0)){ toast('Enter a weight above 0'); return; }
    confirmSheet({title:`Add ${fmt(kgv,1)} kg to the ESG record?`, body:`${CAT[mat]?.label||mat} from the ${zone} collection point.`, ok:'Add weigh-in'}, ()=>{
      S.weighins.unshift({zone,material:mat,kg:kgv,at:now()}); save(); render(); toast(`${fmt(kgv,1)} kg added to the ESG record`); }); }
  if(k==='sched'){ const id=f.dataset.v, d=val('d_'+id); const l=S.listings.find(x=>x.id===id); if(!l||!d) return;
    confirmSheet({title:`Schedule pickup on ${d}?`, body:`${user(l.ownerId).name} will be told to leave “${l.title}” at their bin area that morning.`, ok:'Schedule'}, ()=>{
      if(l.status!=='routed') return; l.status='scheduled'; l.pickupDate=d; notify(l.ownerId,`SDP will collect “${l.title}” on ${d}. Leave it at your bin area that morning.`); save(); render(); toast('Pickup scheduled'); }); }
  if(k==='rate'){ const r=Number(val('rate')); if(!(r>=0)){ toast('Enter a number of ringgit'); return; } S.disposalRate=Math.round(r); save(); render(); toast(`Disposal cost set to RM ${fmt(r)} per tonne`); return; }
  if(k==='code'){ const l=S.listings.find(x=>x.id===f.dataset.v); const c=val('codeIn').toUpperCase();
    if(!l) return; if(c!==l.code){ toast('That code does not match. Check the owner\'s screen.'); return; }
    confirmPickup(l); save(); closeSheet(); render(); toast(`Pickup confirmed. +${PTS.receive} points, and ${user(l.ownerId).name} got +${PTS.reuse}`); }
  if(k==='show'){ const p={title:val('sp_t'),material:val('sp_m'),kg:Number(val('sp_k')),location:val('sp_l'),shape:val('sp_s'),note:val('sp_n')};
    if(!p.title||!(p.kg>0)){ toast('Add a name and the weight reused'); return; }
    const bf=document.getElementById('sp_bf')?.files?.[0], af=document.getElementById('sp_af')?.files?.[0];
    (async()=>{ try{ p.before = bf ? await fileToDataUrl(bf,800) : null; p.after = af ? await fileToDataUrl(af,800) : null; }
      catch(e){ toast('A photo could not be opened. Try a JPG or PNG.'); return; }
    confirmSheet({title:`Publish “${p.title}” to residents?`, body:'Every resident gets a notification and sees it on their Impact page.', ok:'Publish'}, ()=>{
      S.showcase.unshift({id:uid('s'),title:p.title,material:p.material||'Construction surplus',kg:p.kg,location:p.location||'Elmina',date:new Date(now()).toISOString().slice(0,7),shape:p.shape,note:p.note,before:p.before,after:p.after});
      S.users.forEach(u=>notify(u.id,`New SDP Showcase project: ${p.title}.`)); save(); render(); toast('Published to residents'); }); })(); }
});
function keepEdits(){ const sn=U.snap; const lt=document.getElementById('lt'), ld=document.getElementById('ld'), sf=document.getElementById('sf');
  if(lt) sn.title=lt.value; if(ld) sn.descEdit=ld.value; if(sf) sn.swapFor=sf.value; }
function postListing(){
  keepEdits(); const sn=U.snap, r=sn.result; const t=now();
  const l = {id:uid('l'),ownerId:'me',title:(sn.title||r.item).slice(0,70),category:r.category,description:sn.descEdit||r.description,condition:r.condition,route:'reuse',
    weightKg:r.weightKg,valueRm:r.valueRm,mode:sn.mode,swapFor:sn.mode==='swap'?sn.swapFor:'',zone:user('me').zone,createdAt:t,expiresAt:t+LIST_DAYS*DAY,
    status:'open',claimerId:null,code:code6(),warned:false,photo:sn.photo,sample:false};
  S.listings.unshift(l); matchWishes(l); S.marketTab='mine'; S.view='market'; resetSnap(); save(); render(); window.scrollTo(0,0);
  toast('Posted. Neighbours with a matching wishlist have been notified');
}
function sendRecycle(){
  const sn=U.snap, r=sn.result, t=now();
  S.listings.unshift({id:uid('l'),ownerId:'me',title:r.item,category:r.category,description:r.description,condition:r.condition,route:'recycle',weightKg:r.weightKg,valueRm:0,mode:'free',swapFor:'',
    zone:user('me').zone,createdAt:t,expiresAt:t,status:'routed',routedAt:t,claimerId:null,code:code6(),warned:true,photo:sn.photo,sample:false});
  notify('admin',`New recycling item from ${user('me').zone}: ${r.item}.`);
  resetSnap(); save(); render(); toast(`Added to SDP collection. +${PTS.recycle} points on pickup`);
}

processClock(); if(SESSION) applySession(); save(); render();
// Re-check the saved sign-in with the server (skipped quietly when offline).
if(SESSION) fetch('api/session',{method:'POST',headers:{Authorization:'Bearer '+SESSION.token}})
  .then(r=>{ if(r.status===401){ setSession(null); U.gate={mode:'resident',err:'Your sign-in expired. Sign in again.',busy:false,id:''}; render(); } })
  .catch(()=>{});
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
